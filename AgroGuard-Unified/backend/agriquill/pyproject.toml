[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriquill-api"
version = "0.1.0"
description = "FastAPI backend for AgriQill (farm contracts, water planning, twin rehearsal, field app)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2.0",
    "aquacrop==3.1.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "geoalchemy2>=0.16,<1.0",
    "httpx>=0.28,<1.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pcse==6.0.13",
    "pandas>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "truststore>=0.10,<1.0",
    "scikit-learn>=1.7,<1.8",
    "uvicorn[standard]>=0.34,<1.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "Pillow>=9.0.0",
    "paramiko>=4.0,<6.0",
    "h5py>=3.12,<4.0",
    "ortools>=9.12,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.13,<2.0",
]
mcp = [
    "fastmcp>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agriquill*"]

[tool.setuptools.package-data]
agriquill = ["data/*.json", "data/*.csv", "data/*.md", "data/wofost/*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["agriquill"]
warn_redundant_casts = true
no_implicit_optional = true
# Run with: python -m mypy   (from backend/agriquill)

[[tool.mypy.overrides]]
# Libraries that ship no type information (or whose stubs aren't installed).
module = ["h5py", "paramiko", "scipy.*", "joblib", "pandas", "pandas.*", "yaml", "aquacrop", "aquacrop.*", "pcse", "pcse.*"]
ignore_missing_imports = true
